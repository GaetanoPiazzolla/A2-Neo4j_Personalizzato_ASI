name: asi-neo4j

services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: neo4j-demo
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
    name: asineo4j_data
    external: true
  neo4j_plugins:
    name: asineo4j_plugins
    external: true
